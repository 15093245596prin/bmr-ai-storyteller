<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黯月初升 · AI说书人</title><style>body{font-family:system-ui;margin:auto;max-width:760px;padding:24px;background:#f3ead7;color:#29231c}button,input,select{font:inherit;padding:10px;margin:4px;border-radius:10px;border:1px solid #a99572}button{background:#7b1f24;color:white}.card{background:#fff9ed;padding:16px;margin:12px 0;border-radius:16px}.dead{opacity:.45}small{color:#725}</style></head><body><h1>🌙 黯月初升 · AI说书人</h1><div id="setup" class="card"><input id="name" placeholder="你的昵称"><button onclick="create()">创建房间</button><br><input id="code" placeholder="房间码"><button onclick="join()">加入房间</button></div><div id="app"></div><script src="/socket.io/socket.io.js"></script><script>
const s=io();let state,priv,host=false;const $=x=>document.getElementById(x);function create(){s.emit('create',{name:$('name').value},r=>{host=r.ok;alert(r.ok?'房间码 '+r.code:r.error)})}function join(){s.emit('join',{code:$('code').value,name:$('name').value},r=>{if(!r.ok)alert(r.error)})}s.on('state',x=>{state=x;render()});s.on('private',x=>{priv=x;render()});
async function start(){let rs=await fetch('/api/roles').then(r=>r.json()),keys=Object.keys(rs);let chosen=[];for(let i=0;i<state.players.length;i++){let v=document.querySelector('#r'+i).value;chosen.push(v)}s.emit('start',{script:chosen},r=>{if(!r.ok)alert(r.error)})}
async function render(){if(!state)return;let h=`<div class=card><b>房间 ${state.code}</b> · ${state.phase==='lobby'?'等待中':state.phase==='night'?'第'+state.night+'夜':'第'+state.day+'天'}<p>${state.players.map(p=>`<span class=${p.alive?'':'dead'}>${p.name}${p.alive?'':' 💀'}</span>`).join(' · ')}</p></div>`;
if(priv?.you?.roleInfo)h+=`<div class=card><h2>你的身份：${priv.you.roleInfo.name}</h2><p>${priv.you.roleInfo.desc}</p><small>阵营：${priv.you.team}</small></div>`;
if(priv?.action){let others=state.players.filter(p=>p.id!==priv.you.id&&p.alive);h+=`<div class=card><h3>🌘 轮到你行动</h3><select id=t>${others.map(p=>`<option value=${p.id}>${p.name}</option>`)}</select><button onclick="act()">确认选择</button><p><small>需要选择两人的角色，MVP 可在后续界面升级；当前提交主目标。</small></p></div>`}
if(host&&state.phase==='lobby'){let rs=await fetch('/api/roles').then(r=>r.json());h+=`<div class=card><h3>房主：配置角色</h3>`+state.players.map((p,i)=>`${p.name} <select id=r${i}>${Object.entries(rs).map(([k,v])=>`<option value=${k}>${v.name}</option>`)}</select><br>`).join('')+`<button onclick=start()>发身份并开始</button></div>`}
if(host&&state.phase==='day')h+=`<div class=card><button onclick="s.emit('nextNight',{},r=>{if(!r.ok)alert(r.error)})">进入下一夜</button></div>`;h+=`<div class=card><h3>公开日志</h3>${state.log.map(x=>`<div>${x}</div>`).join('')}</div>`;$('app').innerHTML=h}
function act(){s.emit('act',{targetId:$('t')?.value},r=>{if(!r.ok)alert(r.error)})}
</script></body></html>
